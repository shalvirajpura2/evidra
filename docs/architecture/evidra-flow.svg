<tspan x="1170.0" dy="0">Turn answer into voice</tspan>
<tspan x="1170.0" dy="26.599999999999998">Piper / CPU</tspan>
</text>
<path d="M1327 511Q1314 510 1316 524L1315 598Q1315 611 1328 610L1513 609Q1526 610 1525 597L1524 523Q1525 510 1512 510Z" fill="#151617" stroke="#80b8cc" stroke-width="1.4"/>
