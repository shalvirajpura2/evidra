<tspan x="1042.5" dy="0">Make it searchable</tspan>
<tspan x="1042.5" dy="32.199999999999996">Passages + E5 embeddings</tspan>
</text>
<path d="M1320 199C1320 180 1520 180 1520 199L1520 306C1520 325 1320 325 1320 306Z M1320 199C1320 218 1520 218 1520 199" fill="none" stroke="#ddd9ce" stroke-width="1.3"/>
<text x="1420.0" y="234" fill="#ddd9ce" font-family="Comic Sans MS, Comic Sans, cursive" font-size="16" text-anchor="middle">
