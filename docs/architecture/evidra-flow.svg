<text x="720" y="381" fill="#80b8cc" font-family="Comic Sans MS, Comic Sans, cursive" font-size="14" text-anchor="start">
<tspan x="720" dy="0">retrieve evidence from your document</tspan>
</text>
<path d="M920,510L920,415L1470,415L1470,320" fill="none" stroke="#80b8cc" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 6"/>
<text x="1010" y="408" fill="#80b8cc" font-family="Comic Sans MS, Comic Sans, cursive" font-size="14" text-anchor="start">
<tspan x="1010" dy="0">save answer + source references</tspan>
</text>
<text x="65" y="690" fill="#80b8cc" font-family="Comic Sans MS, Comic Sans, cursive" font-size="19" text-anchor="start">
<tspan x="65" dy="0">Hindi: translate question to English for search, then translate the checked answer back to Hindi (NLLB).</tspan>
</text>
<text x="65" y="730" fill="#ddd9ce" font-family="Comic Sans MS, Comic Sans, cursive" font-size="18" text-anchor="start">
<tspan x="65" dy="0">If evidence is insufficient or checks fail, we withhold the draft and explain why. OCR and answers can still be imperfect.</tspan>
</text>
<text x="65" y="770" fill="#d9b16a" font-family="Comic Sans MS, Comic Sans, cursive" font-size="18" text-anchor="start">
<tspan x="65" dy="0">Today: turn-taking, no streaming, shared HF GPU queue. Each visitor has a separate temporary workspace.</tspan>
</text>
<text x="40" y="810" fill="#80b8cc" font-family="Comic Sans MS, Comic Sans, cursive" font-size="15" text-anchor="start">
<tspan x="40" dy="0">Code baseline: main / 0d1888f  |  rshalvi/evidra  |  deployed design, not a future architecture</tspan>
</text>
