<tspan x="200.0" dy="0">Upload a document</tspan>
<tspan x="200.0" dy="32.199999999999996">PDF / image / TXT / MD</tspan>
</text>
<path d="M482 201Q469 200 471 214L470 288Q470 301 483 300L748 299Q761 300 760 287L759 213Q760 200 747 200Z" fill="#151617" stroke="#ddd9ce" stroke-width="1.4"/>
