<text x="420.0" y="553.35" fill="#ddd9ce" font-family="Comic Sans MS, Comic Sans, cursive" font-size="19" text-anchor="middle">
<tspan x="420.0" dy="0">Turn voice into text</tspan>
<tspan x="420.0" dy="26.599999999999998">Whisper / CPU</tspan>
</text>
<path d="M577 511Q564 510 566 524L565 598Q565 611 578 610L763 609Q776 610 775 597L774 523Q775 510 762 510Z" fill="#151617" stroke="#ddd9ce" stroke-width="1.4"/>
<text x="670.0" y="553.35" fill="#ddd9ce" font-family="Comic Sans MS, Comic Sans, cursive" font-size="19" text-anchor="middle">
<tspan x="670.0" dy="0">Find source passages</tspan>
<tspan x="670.0" dy="26.599999999999998">E5 + BM25 + MiniLM</tspan>
</text>
<path d="M827 511Q814 510 816 524L815 598Q815 611 828 610L1013 609Q1026 610 1025 597L1024 523Q1025 510 1012 510Z" fill="#151617" stroke="#d9b16a" stroke-width="1.4"/>
<text x="920.0" y="553.35" fill="#d9b16a" font-family="Comic Sans MS, Comic Sans, cursive" font-size="19" text-anchor="middle">
<tspan x="920.0" dy="0">Write + check answer</tspan>
<tspan x="920.0" dy="26.599999999999998">Qwen3-4B / GPU</tspan>
</text>
<path d="M1077 511Q1064 510 1066 524L1065 598Q1065 611 1078 610L1263 609Q1276 610 1275 597L1274 523Q1275 510 1262 510Z" fill="#151617" stroke="#ddd9ce" stroke-width="1.4"/>
