<text x="40" y="45" fill="#ddd9ce" font-family="Comic Sans MS, Comic Sans, cursive" font-size="30" text-anchor="start">
<tspan x="40" dy="0">evidra / your document, now with a voice</tspan>
</text>
<text x="40" y="78" fill="#80b8cc" font-family="Comic Sans MS, Comic Sans, cursive" font-size="16" text-anchor="start">
<tspan x="40" dy="0">one product flow — read the document first, then answer from its contents</tspan>
</text>
