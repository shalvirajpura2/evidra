[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidra"
version = "0.1.0"
description = "Evidence-backed conversations and reproducible evaluations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "black>=26,<27"]
postgres = ["psycopg[binary]>=3.2,<4"]
documents = ["docling>=2,<3"]
embeddings = ["sentence-transformers>=3,<6", "pgvector>=0.3,<1"]
voice = ["faster-whisper>=1,<2", "av>=16,<17", "piper-tts>=1.3,<2"]
chat = ["transformers>=4.51,<5", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
